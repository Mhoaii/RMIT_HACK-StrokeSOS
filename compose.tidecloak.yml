# The web app runs on Vercel. This container runs ONLY the local Tide identity service.
services:
  tidecloak:
    image: tideorg/tidecloak-dev:latest
    container_name: stroke-sos-tidecloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set the password in .env.local}
    volumes:
      - tidecloak-data:/opt/keycloak/data/h2
    restart: unless-stopped
volumes:
  tidecloak-data:
